name: IIOS CORE-04-C CATL EV EBITDA Real Parse

on:
  pull_request:
    paths:
      - "research/core04c_catl_sources_v0.2.json"
      - "tools/core04c_catl_ev_ebitda.py"
      - "tools/core04c_fetch_and_parse.py"
      - "tests/test_core04c_catl_ev_ebitda.py"
      - "docs/iios/CORE_04C_CATL_EV_EBITDA_ACCEPTANCE_2026-10-05.md"
  push:
    branches: [main]
    paths:
      - "research/core04c_catl_sources_v0.2.json"
      - "tools/core04c_catl_ev_ebitda.py"
      - "tools/core04c_fetch_and_parse.py"
      - "tests/test_core04c_catl_ev_ebitda.py"
      - "docs/iios/CORE_04C_CATL_EV_EBITDA_ACCEPTANCE_2026-10-05.md"

permissions:
  contents: read

jobs:
  real-ev-ebitda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest pymupdf
      - run: python -m compileall -q tools tests/test_core04c_catl_ev_ebitda.py
      - run: python -m pytest -q tests/test_core04c_catl_ev_ebitda.py
      - id: parse
        run: |
          PYTHONPATH=. python tools/core04c_fetch_and_parse.py             --manifest research/core04c_catl_sources_v0.2.json             --out /tmp/core04c/final
        continue-on-error: true
      - name: Inspect parser source context on failure
        if: ${{ steps.parse.outcome == 'failure' }}
        run: |
          echo "=== FY2025 label probes ==="
          pdftotext -layout /tmp/core04c/final/CNINFO-FY2025-2026-03-10.pdf - | grep -E -m 20 "利润|总额|固定资产折旧|使用权资产折旧|无形资产摊销|长期待摊" || true
          echo "=== FY2024 label probes ==="
          pdftotext -layout /tmp/core04c/final/CNINFO-FY2024-2025-03-15.pdf - | grep -E -m 20 "利润|总额|固定资产折旧|使用权资产折旧|无形资产摊销|长期待摊" || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: iios-core04c-catl-debug-raw-bundle
          path: /tmp/core04c/final/
          retention-days: 7
      - name: Enforce real parse success
        run: |
          if [ "${{ steps.parse.outcome }}" != "success" ]; then
            echo "CORE-04-C real parse failed"
            exit 1
          fi
      - run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          p = Path("/tmp/core04c/final/core04c_catl_ev_ebitda_observations.json")
          x = json.loads(p.read_text())
          assert x["status"] == "PASS / HISTORICAL OBSERVATIONS ADMITTED"
          assert len(x["observations"]) == 3
          expected = {
              "CATL-EVEBITDA-2025-10-22": Decimal("16.3854513730104779459499377618525879665943916394869455326834"),
              "CATL-EVEBITDA-2026-04-17": Decimal("15.1302979548591306456425069051738011634952852968035319146755"),
              "CATL-EVEBITDA-2026-07-27": Decimal("13.6686920853194080865159796474107277185842350664948830139214"),
          }
          for row in x["observations"]:
              assert row["admission_status"] == "ADMITTED"
              assert Decimal(row["ev_ebitda"]) == expected[row["observation_id"]]
              assert row["source_hashes"]
          print("CORE04C_REAL_EV_EBITDA_OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iios-core04c-catl-ev-ebitda-evidence
          path: /tmp/core04c/final/
          retention-days: 14
