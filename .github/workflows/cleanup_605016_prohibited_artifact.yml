name: Cleanup Restricted 605016 Exploratory Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/cleanup_605016_prohibited_artifact.yml"

permissions:
  actions: write
  contents: read

jobs:
  delete-prohibited-yahoo-capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Delete only the exploratory Yahoo chart artifact captured without prior permission
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: "11664729821"
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          if [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "Restricted exploratory artifact $ARTIFACT_ID deleted or already absent (HTTP $status)."
          else
            cat "$response_file"
            echo "Artifact deletion did not succeed (HTTP $status)." >&2
            exit 1
          fi
