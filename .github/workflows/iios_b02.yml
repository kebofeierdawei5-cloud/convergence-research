name: IIOS B02 — Canonical Investment Admission Contract

on:
  pull_request:
    paths:
      - "iios_mvp/canonical_investment_admission_v01.py"
      - "tests/test_b02_canonical_investment_admission.py"
      - "schemas/canonical_investment_admission_reference_v0.1.schema.json"
      - ".github/workflows/iios_b02.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/canonical_investment_admission_v01.py"
      - "tests/test_b02_canonical_investment_admission.py"
      - "schemas/canonical_investment_admission_reference_v0.1.schema.json"
      - ".github/workflows/iios_b02.yml"

permissions:
  contents: read

jobs:
  b02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests
      - run: PYTHONPATH=. pytest -q tests/test_b02_canonical_investment_admission.py
      - run: python -m json.tool schemas/canonical_investment_admission_reference_v0.1.schema.json >/dev/null
      - run: git diff --check
