name: IIOS CORE-04 PIT Market Observation Admission

on:
  pull_request:
    paths:
      - "iios_mvp/market_observation_admission.py"
      - "schemas/verified_market_evidence_v0.1.schema.json"
      - "tests/test_market_observation_admission.py"
      - "docs/iios/CORE_04A_PIT_MARKET_OBSERVATION_ADMISSION_v0.1.md"
  push:
    branches: [main]
    paths:
      - "iios_mvp/market_observation_admission.py"
      - "schemas/verified_market_evidence_v0.1.schema.json"
      - "tests/test_market_observation_admission.py"
      - "docs/iios/CORE_04A_PIT_MARKET_OBSERVATION_ADMISSION_v0.1.md"

permissions:
  contents: read

jobs:
  core04-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests/test_market_observation_admission.py
      - run: python -m pytest -q tests/test_market_observation_admission.py
      - run: python -m json.tool schemas/verified_market_evidence_v0.1.schema.json >/dev/null
      - run: git diff --check
