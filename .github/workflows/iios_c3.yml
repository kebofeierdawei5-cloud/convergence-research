name: IIOS C3 Second Company — Kolun

on:
  pull_request:
    paths:
      - "examples/real_cases/RC-CN-A-002422-20261004_c3_input.json"
      - "evidence/real_cases/RC-CN-A-002422-20261004/c3_price_capture.txt"
      - "tools/c3_kolun_second_company_e2e.py"
      - "tests/test_c3_kolun_second_company_e2e.py"
      - "docs/iios/C3_SECOND_COMPANY_v0.1.md"
      - ".github/workflows/iios_c3.yml"
  push:
    branches: [main]
    paths:
      - "examples/real_cases/RC-CN-A-002422-20261004_c3_input.json"
      - "evidence/real_cases/RC-CN-A-002422-20261004/c3_price_capture.txt"
      - "tools/c3_kolun_second_company_e2e.py"
      - "tests/test_c3_kolun_second_company_e2e.py"
      - "docs/iios/C3_SECOND_COMPANY_v0.1.md"
      - ".github/workflows/iios_c3.yml"

permissions:
  contents: read

jobs:
  c3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tools tests
      - run: pytest -q tests/test_c3_kolun_second_company_e2e.py
      - run: git diff --check
