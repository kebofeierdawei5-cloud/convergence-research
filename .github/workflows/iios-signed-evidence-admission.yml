name: IIOS Signed Evidence Admission Gate

on:
  pull_request:
    paths:
      - "iios_mvp/canonical_signed_evidence_admission_v01.py"
      - "tests/test_canonical_signed_evidence_admission_v01.py"
      - "iios_mvp/operator_attested_price_input_v01.py"
      - "tests/test_operator_attested_price_input_v01.py"
      - "evidence/authority/IIOS_EVIDENCE_ADMISSION_SIGNER_REGISTRY_v01.json"
      - ".github/workflows/iios-signed-evidence-admission.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/canonical_signed_evidence_admission_v01.py"
      - "tests/test_canonical_signed_evidence_admission_v01.py"
      - "evidence/authority/IIOS_EVIDENCE_ADMISSION_SIGNER_REGISTRY_v01.json"
      - ".github/workflows/iios-signed-evidence-admission.yml"

permissions:
  contents: read

jobs:
  signed-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Compile deterministic admission and operator-price input gates
        run: python -m compileall -q iios_mvp/canonical_signed_evidence_admission_v01.py iios_mvp/operator_attested_price_input_v01.py tests/test_canonical_signed_evidence_admission_v01.py tests/test_operator_attested_price_input_v01.py
      - name: Run deterministic admission and operator-price input tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_canonical_signed_evidence_admission_v01.py tests/test_operator_attested_price_input_v01.py
