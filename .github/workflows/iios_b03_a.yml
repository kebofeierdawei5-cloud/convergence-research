name: IIOS B03-A — Upstream Authority Integration

on:
  pull_request:
    paths:
      - "iios_mvp/canonical_investment_admission_v01.py"
      - "iios_mvp/upstream_authority_v03.py"
      - "tests/test_b03_a_upstream_authority.py"
      - ".github/workflows/iios_b03_a.yml"

permissions:
  contents: read

jobs:
  b03-a:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests
      - run: PYTHONPATH=. pytest -q tests/test_b03_a_upstream_authority.py
      - run: git diff --check
