name: IIOS C7 — Full Lifecycle E2E
# exact-head acceptance refresh 2

on:
  pull_request:
    paths:
      - "tests/test_c7_full_lifecycle_e2e.py"
      - "tools/c7_full_lifecycle_e2e.py"
      - "docs/iios/C7_FULL_LIFECYCLE_E2E_v0.1.md"
      - ".github/workflows/iios_c7.yml"
      - "iios_mvp/execution_receipt_production.py"
      - "iios_mvp/store.py"
      - "iios_mvp/trigger_production.py"
      - "iios_mvp/monitoring_state.py"
      - "iios_mvp/validation_replay.py"
      - "iios_mvp/machine_publication.py"
      - "iios_mvp/human_report.py"
      - "iios_mvp/decision_lifecycle_production.py"
  push:
    branches: [main]
    paths:
      - "tests/test_c7_full_lifecycle_e2e.py"
      - "tools/c7_full_lifecycle_e2e.py"
      - "docs/iios/C7_FULL_LIFECYCLE_E2E_v0.1.md"
      - ".github/workflows/iios_c7.yml"
      - "iios_mvp/execution_receipt_production.py"
      - "iios_mvp/store.py"
      - "iios_mvp/trigger_production.py"
      - "iios_mvp/monitoring_state.py"
      - "iios_mvp/validation_replay.py"
      - "iios_mvp/machine_publication.py"
      - "iios_mvp/human_report.py"
      - "iios_mvp/decision_lifecycle_production.py"

permissions:
  contents: read

jobs:
  c7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tools tests
      - run: PYTHONPATH=. pytest -q tests/test_c7_full_lifecycle_e2e.py tests/test_c6_execution_receipt_production.py tests/test_trigger_production.py tests/test_monitoring_state.py tests/test_validation_replay.py tests/test_machine_publication.py tests/test_human_report.py tests/test_decision_lifecycle_production.py
      - run: PYTHONPATH=. python tools/c7_full_lifecycle_e2e.py
      - run: git diff --check
