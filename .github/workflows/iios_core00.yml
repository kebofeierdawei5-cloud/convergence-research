name: IIOS CORE-00 Scope Reconciliation

on:
  pull_request:
    paths:
      - "docs/iios/CORE_00_SCOPE_RECONCILIATION_v0.1.md"
      - "docs/iios/B2_A02_DEVELOPMENT_STATUS_2026-10-04.md"
      - "docs/iios/IIOS_CONSOLIDATED_POST_REDTEAM_DEVELOPMENT_PLAN_2026-10-04.md"
      - "docs/iios/IIOS_PROJECT_CONTINUITY_AND_MACRO_PLAN_2026-10-04.md"
      - "docs/PROJECT_STATE_INDEX.md"
      - "STATUS.md"
      - "tests/test_core00_scope.py"
      - ".github/workflows/iios_core00.yml"
      - ".github/workflows/iios_mvp.yml"
  push:
    branches: [main]
    paths:
      - "docs/iios/CORE_00_SCOPE_RECONCILIATION_v0.1.md"
      - "docs/iios/B2_A02_DEVELOPMENT_STATUS_2026-10-04.md"
      - "docs/iios/IIOS_CONSOLIDATED_POST_REDTEAM_DEVELOPMENT_PLAN_2026-10-04.md"
      - "docs/iios/IIOS_PROJECT_CONTINUITY_AND_MACRO_PLAN_2026-10-04.md"
      - "docs/PROJECT_STATE_INDEX.md"
      - "STATUS.md"
      - "tests/test_core00_scope.py"
      - ".github/workflows/iios_core00.yml"
      - ".github/workflows/iios_mvp.yml"

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Investment Core
        run: python -m compileall -q iios_mvp
      - name: Run CORE-00 isolation tests
        run: python -m pytest -q tests/test_core00_scope.py
      - name: Verify diff whitespace
        run: git diff --check
