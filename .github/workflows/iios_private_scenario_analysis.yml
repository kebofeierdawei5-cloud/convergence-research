name: IIOS Private Path A Scenario Analysis

on:
  pull_request:
    paths:
      - "iios_mvp/private_scenario_analysis_v01.py"
      - "iios_mvp/operator_attested_price_input_v01.py"
      - "iios_mvp/operator_entered_price_decision_input_v01.py"
      - "tests/test_operator_entered_price_decision_input_v01.py"
      - "tests/test_private_scenario_analysis_v01.py"
      - ".github/workflows/iios_private_scenario_analysis.yml"
      - "docs/iios/PRIVATE_SCENARIO_ANALYSIS_PATH_A_V01_20261011.md"
  push:
    branches:
      - main
    paths:
      - "iios_mvp/private_scenario_analysis_v01.py"
      - "iios_mvp/operator_attested_price_input_v01.py"
      - "iios_mvp/operator_entered_price_decision_input_v01.py"
      - "tests/test_operator_entered_price_decision_input_v01.py"
      - "tests/test_private_scenario_analysis_v01.py"
      - ".github/workflows/iios_private_scenario_analysis.yml"
      - "docs/iios/PRIVATE_SCENARIO_ANALYSIS_PATH_A_V01_20261011.md"

permissions:
  contents: read

jobs:
  private-scenario-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile IIOS modules
        run: python -m compileall -q iios_mvp
      - name: Test Path A private scenario runner and its intake contract
        run: PYTHONPATH=. pytest -q tests/test_private_scenario_analysis_v01.py tests/test_operator_attested_price_input_v01.py tests/test_operator_entered_price_decision_input_v01.py
      - name: Check diff formatting
        run: git diff --check
