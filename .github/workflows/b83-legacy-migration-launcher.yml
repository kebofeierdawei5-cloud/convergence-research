name: IIOS B83 legacy-run migration launcher

on:
  workflow_dispatch:
  push:
    branches: [feat/b83-durable-task-resume-20261108]
    paths:
      - "B83_旧运行包迁移验收.command"
      - "tools/package_b83_legacy_migration_launcher_v01.py"
      - "tests/test_b83_legacy_migration_launcher_v01.py"
      - ".github/workflows/b83-legacy-migration-launcher.yml"

permissions:
  contents: read

jobs:
  package-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact B83 revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate one-click launcher syntax
        run: bash -n "B83_旧运行包迁移验收.command"
      - name: Package one-click launcher with executable POSIX mode
        run: python tools/package_b83_legacy_migration_launcher_v01.py --output-dir dist --commit-sha "$GITHUB_SHA"
      - name: Install packaging test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test launcher isolation, fixed run ID and ZIP permission
        run: python -m pytest -q tests/test_b83_legacy_migration_launcher_v01.py
      - name: Check diff formatting
        run: git diff --check
      - name: Upload B83 migration launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: IIOS-B83-legacy-migration-launcher-${{ github.sha }}
          path: dist/IIOS-B83-legacy-migration-*.zip
          if-no-files-found: error
          retention-days: 30
