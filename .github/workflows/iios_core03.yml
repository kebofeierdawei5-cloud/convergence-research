name: IIOS CORE-03 Real 300750

on:
  pull_request:
    paths:
      - "iios_mvp/core03_market_expectation.py"
      - "iios_mvp/cli.py"
      - "iios_mvp/company_economic_core.py"
      - "iios_mvp/valuation.py"
      - "iios_mvp/p4f_mie_snapshot.py"
      - "iios_mvp/market_implied_expectation.py"
      - "iios_mvp/multi_model_market_implied_expectation_set.py"
      - "iios_mvp/market_model_domain.py"
      - "schemas/core03_research_package_v0.1.schema.json"
      - "tests/test_core03_real_300750.py"
      - "examples/real_cases/RC-CN-A-300750-20261004_core03_input.json"
      - "examples/real_cases/RC-CN-A-300750-20261004_core02_input.json"
      - "evidence/real_cases/RC-CN-A-300750-20261004/**"
  push:
    branches: [main]
    paths:
      - "iios_mvp/core03_market_expectation.py"
      - "iios_mvp/cli.py"
      - "iios_mvp/company_economic_core.py"
      - "schemas/core03_research_package_v0.1.schema.json"
      - "tests/test_core03_real_300750.py"
      - "examples/real_cases/RC-CN-A-300750-20261004_core03_input.json"
      - "examples/real_cases/RC-CN-A-300750-20261004_core02_input.json"
      - "evidence/real_cases/RC-CN-A-300750-20261004/**"

permissions:
  contents: read

jobs:
  core03-real:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests/test_core03_real_300750.py
      - run: python -m pytest -q tests/test_core03_real_300750.py tests/test_company_economic_core.py tests/test_research_intake.py tests/test_value_core.py
      - run: python -m json.tool schemas/core03_research_package_v0.1.schema.json >/dev/null
      - run: |
          PYTHONPATH=. python -m iios_mvp.cli core03             examples/real_cases/RC-CN-A-300750-20261004_core03_input.json             --out /tmp/RC-CN-A-300750-20261004_core03.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/RC-CN-A-300750-20261004_core03.json")
          core = json.loads(p.read_text(encoding="utf-8"))
          assert core["case_id"] == "RC-CN-A-300750-20261004"
          assert core["company_valuation"]["primary_model"] == "dcf"
          assert core["p4f_market_implied_expectation"]["status"] == "BLOCKED"
          assert core["expectation_gap"]["status"] == "BLOCKED"
          print("REAL_300750_CORE03_OK")
          PY
      - run: git diff --check
