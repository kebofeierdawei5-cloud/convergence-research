name: IIOS A1-03 Quality Gate Integration

on:
  pull_request:
    paths:
      - "iios_mvp/company_evidence_quality_integration.py"
      - "schemas/company_evidence_quality_integration_v0.1.schema.json"
      - "tests/test_company_evidence_quality_integration.py"
      - "examples/real_cases/RC-CN-A-300750-20261004_core03_input.json"
      - "docs/iios/A1_03_QUALITY_GATE_INTEGRATION_v0.1.md"
      - ".github/workflows/iios_a1_03.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/company_evidence_quality_integration.py"
      - "schemas/company_evidence_quality_integration_v0.1.schema.json"
      - "tests/test_company_evidence_quality_integration.py"
      - "examples/real_cases/RC-CN-A-300750-20261004_core03_input.json"
      - "docs/iios/A1_03_QUALITY_GATE_INTEGRATION_v0.1.md"
      - ".github/workflows/iios_a1_03.yml"

permissions:
  contents: read

jobs:
  a1-03:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests/test_company_evidence_quality_integration.py
      - run: python -m pytest -q tests/test_company_evidence_quality_integration.py
      - run: python -m json.tool schemas/company_evidence_quality_integration_v0.1.schema.json >/dev/null
      - run: git diff --check
