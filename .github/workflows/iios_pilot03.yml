name: IIOS PILOT-03 — Observed Friction Remediation

on:
  pull_request:
    paths:
      - ".github/workflows/iios_pilot02_xinhecheng.yml"
      - ".github/workflows/iios_pilot03.yml"
      - "tools/pilot02_xinhecheng_e2e.py"
      - "tests/test_pilot02_risk_discipline.py"
      - "docs/iios/PILOT-03_OBSERVED_FRICTION_20261007.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-03:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check pytest jsonschema pypdf

      - name: Scope check
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "origin/main...HEAD" > /tmp/pilot03_changed_all.txt
          cat /tmp/pilot03_changed_all.txt
          python - <<'PY'
          from pathlib import Path

          changed = set(Path("/tmp/pilot03_changed_all.txt").read_text(encoding="utf-8").splitlines())
          # PILOT-03 owns a narrow set of regression surfaces. On a cross-cutting
          # P0 authorization PR, unrelated Core/runtime files are enforced by the
          # repository-wide exact-head CI and independent red-team, not by this
          # historical pilot's single-purpose allow-list. This check still fails
          # closed for any unexpected change inside the Pilot-02/03 surface.
          pilot_surface = {
              ".github/workflows/iios_pilot02_xinhecheng.yml",
              ".github/workflows/iios_pilot03.yml",
              "tools/pilot02_xinhecheng_e2e.py",
              "tests/test_pilot02_risk_discipline.py",
              "docs/iios/PILOT-03_OBSERVED_FRICTION_20261007.md",
          }
          related = {
              path for path in changed
              if path in pilot_surface
              or path.startswith("tests/test_pilot02_")
              or path.startswith("docs/iios/PILOT-03_")
              or path.startswith("tools/pilot02_")
          }
          unexpected = sorted(related - pilot_surface)
          if unexpected:
              raise SystemExit("Unexpected PILOT-03 surface change: " + ", ".join(unexpected))
          unrelated = sorted(changed - related)
          print(f"PILOT-03 scoped files checked: {sorted(related)}")
          print(f"Cross-cutting files delegated to repo-wide CI/red-team: {len(unrelated)}")
          PY

      - name: Compile touched test surface
        run: python -m compileall -q tests iios_mvp

      - name: Run PILOT-03 regression tests
        run: PYTHONPATH=. pytest -q tests/test_pilot02_risk_discipline.py tests/test_canonical_current_price.py tests/test_decision_kernel_v03.py

      - name: Diff check
        run: git diff --check
