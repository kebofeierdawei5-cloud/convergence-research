name: IIOS FM00 Baseline

on:
  push:
    branches: [main]
    paths:
      - 'research/fm00/**'
      - '.github/workflows/iios_fm00.yml'
      - 'docs/iios/**'
      - 'manifests/iios/**'
  pull_request:
    paths:
      - 'research/fm00/**'
      - '.github/workflows/iios_fm00.yml'
      - 'docs/iios/**'
      - 'manifests/iios/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fm00:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install FM00 validation dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.26.0'

      - name: Compile FM00
        run: python -m compileall -q research/fm00

      - name: Run FM00 unit tests
        run: python -m unittest discover -s research/fm00/tests -p 'test_*.py' -v

      - name: Run FM00 contract validator
        run: python research/fm00/fm00_validator.py

      - name: Verify repository diff whitespace
        run: git diff --check
