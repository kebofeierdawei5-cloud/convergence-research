name: IIOS Company Evidence Intake (Free-First)

on:
  pull_request:
    paths:
      - "tools/company_evidence_intake.py"
      - "tools/verify_company_evidence_intake.py"
      - "tools/route_a_b2_preflight.py"
      - "tools/route_a_fact_review.py"
      - "tools/route_a_capture_final_gate.py"
      - "tests/test_route_a_capture_final_gate.py"
      - "tests/test_route_a_fact_review.py"
      - "schemas/route_a_b2_preflight_v0.1.schema.json"
      - "tests/test_route_a_b2_preflight.py"
      - "tests/independent_redteam_route_a_b2_preflight.py"
      - "schemas/company_evidence_intake_manifest_v0.1.schema.json"
      - "manifests/company_evidence_intake_template_v0.1.json"
      - "tests/test_company_evidence_intake.py"
      - "tests/independent_redteam_company_evidence_intake.py"
      - "docs/iios/COMPANY_EVIDENCE_INTAKE_FREE_FIRST_v0.1.md"
      - "docs/iios/ROUTE_A_FACT_EXTRACTION_REVIEW_20261009.md"
      - ".github/workflows/iios_company_evidence_intake.yml"
      - ".github/workflows/iios_company_evidence_capture.yml"
      - "manifests/company_cases/RC-CN-A-002001-20261009.json"
      - "tests/test_company_evidence_capture_workflow.py"
      - "tools/route_a_b2_preflight.py"
      - "schemas/route_a_b2_preflight_v0.1.schema.json"
      - "tests/test_route_a_b2_preflight.py"
      - "tests/independent_redteam_route_a_b2_preflight.py"
      - "tools/public_web_discovery.py"
      - "schemas/public_web_discovery_record_v0.2.schema.json"
      - "tests/test_public_web_discovery.py"
      - "tests/test_public_web_discovery_workflow.py"
      - ".github/workflows/iios_public_web_discovery.yml"
      - "docs/iios/PUBLIC_WEB_DISCOVERY_FREE_FIRST_v0.1.md"
  push:
    branches: [main]
    paths:
      - "tools/company_evidence_intake.py"
      - "tools/verify_company_evidence_intake.py"
      - "schemas/company_evidence_intake_manifest_v0.1.schema.json"
      - "manifests/company_evidence_intake_template_v0.1.json"
      - "tests/test_company_evidence_intake.py"
      - "tests/independent_redteam_company_evidence_intake.py"
      - "docs/iios/COMPANY_EVIDENCE_INTAKE_FREE_FIRST_v0.1.md"
      - ".github/workflows/iios_company_evidence_intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-redteam:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema pyyaml pypdf
      - name: Compile intake and verifier
        run: python -m compileall -q tools/company_evidence_intake.py tools/verify_company_evidence_intake.py tools/route_a_b2_preflight.py tools/route_a_capture_final_gate.py research/b2
      - name: Compile and test page-located Route A fact extraction (not admission)
        run: |
          python -m compileall -q tools/route_a_fact_review.py tests/test_route_a_fact_review.py
          PYTHONPATH=. pytest -q tests/test_route_a_fact_review.py
      - name: Validate schema and manifest
        run: |
          python -m json.tool schemas/company_evidence_intake_manifest_v0.1.schema.json >/dev/null
          python -m json.tool schemas/route_a_b2_preflight_v0.1.schema.json >/dev/null
          python -m json.tool manifests/company_evidence_intake_template_v0.1.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path(".")
          schema = json.loads((root / "schemas/company_evidence_intake_manifest_v0.1.schema.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          manifests = [
              root / "manifests/company_evidence_intake_template_v0.1.json",
              *sorted((root / "manifests/company_cases").glob("*.json")),
          ]
          for manifest_path in manifests:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              Draft202012Validator(schema).validate(manifest)
              print("validated", manifest_path)
          PY
          python tools/company_evidence_intake.py --manifest manifests/company_evidence_intake_template_v0.1.json --out /tmp/unused --validate-only
          python tools/company_evidence_intake.py --manifest manifests/company_cases/RC-CN-A-002001-20261009.json --out /tmp/unused --validate-only
      - name: Run company evidence intake tests
        run: python -m pytest -q tests/test_company_evidence_intake.py
      - name: Run Route A to B2 preflight tests
        run: python -m pytest -q tests/test_route_a_b2_preflight.py
      - name: Run Route A to B2 independent red-team
        run: python -m pytest -q tests/independent_redteam_route_a_b2_preflight.py
      - name: Run Route A capture final-gate tests
        run: python -m pytest -q tests/test_route_a_capture_final_gate.py
      - name: Run capture workflow contract tests
        run: python -m pytest -q tests/test_company_evidence_capture_workflow.py
      - name: Run no-key public web discovery tests
        run: python -m pytest -q tests/test_public_web_discovery.py tests/test_public_web_discovery_workflow.py
      - name: Run independent red-team tests
        run: python -m pytest -q tests/independent_redteam_company_evidence_intake.py
      - name: Diff check
        run: git diff --check
