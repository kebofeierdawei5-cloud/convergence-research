name: IIOS C1 Machine Publication

on:
  pull_request:
    paths:
      - "iios_mvp/machine_publication.py"
      - "iios_mvp/cli.py"
      - "schemas/machine_publication_v0.1.schema.json"
      - "tests/test_machine_publication.py"
      - "docs/iios/C1_MACHINE_PUBLICATION_v0.1.md"
      - ".github/workflows/iios_c1.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/machine_publication.py"
      - "iios_mvp/cli.py"
      - "schemas/machine_publication_v0.1.schema.json"
      - "tests/test_machine_publication.py"
      - "docs/iios/C1_MACHINE_PUBLICATION_v0.1.md"
      - ".github/workflows/iios_c1.yml"

permissions:
  contents: read

jobs:
  c1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests
      - run: python -m pytest -q tests/test_machine_publication.py
      - run: python -m json.tool schemas/machine_publication_v0.1.schema.json >/dev/null
      - run: git diff --check
