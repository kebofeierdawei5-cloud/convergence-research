name: IIOS M1.2 FM04 Second Red-team

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/fm00/**"
      - "research/fm01/**"
      - "research/fm02/**"
      - "research/fm03/**"
      - "research/fm04/**"
      - ".github/workflows/iios_m12_fm04_second_redteam.yml"

permissions:
  contents: read

jobs:
  second-redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact upstream anchors
        run: |
          test "$(git hash-object research/fm03/FM03_STATE_CONTRACT.json)" = "1ede6cfd87476e466010a229599c52f984b24de6"
          test "$(git hash-object research/fm01/CATL_DRIVER_HISTORY.ndjson)" = "8fbdafaa941587d843ab2509bb732620f5f66b4d"
          test "$(git hash-object research/fm00/OU-M12-FM00-CATL-001.json)" = "abe9c575ea4a194249a419bbb145b5ddf7dd05de"
          echo "Upstream exact anchors: PASS"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Build FM02 snapshot
        run: |
          python research/fm02/fm02_feature_builder.py             --output /tmp/FM02_FEATURE_SNAPSHOT.ndjson             --receipt /tmp/FM02_FEATURE_BUILD_RECEIPT.json

      - name: Build FM03 snapshot
        run: |
          python research/fm03/fm03_state_engine.py             --feature-snapshot /tmp/FM02_FEATURE_SNAPSHOT.ndjson             --output /tmp/FM03_STATE_SNAPSHOT.ndjson             --receipt /tmp/FM03_STATE_BUILD_RECEIPT.json

      - name: Pin FM03 snapshot
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          rows=[json.loads(x) for x in Path("/tmp/FM03_STATE_SNAPSHOT.ndjson").read_text().splitlines() if x.strip()]
          sha=hashlib.sha256(json.dumps(rows, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          assert len(rows)==22
          assert sha=="7e020df6eeb5b6aa4cf47e625d902c3c5ca7645457427c8af085a55d25811fd4"
          print("FM03 exact content pin: PASS")
          PY

      - name: Execute second red-team attack harness
        env:
          FM03_STATE_SNAPSHOT: /tmp/FM03_STATE_SNAPSHOT.ndjson
        run: |
          PYTHONPATH=research/fm04 python research/fm04/fm04_second_redteam.py | tee /tmp/FM04_SECOND_REDTEAM_RESULT.json

      - name: Assert vulnerabilities are reproduced
        run: |
          python - <<'PY'
          import json
          d=json.loads(open("/tmp/FM04_SECOND_REDTEAM_RESULT.json").read())
          assert d["baseline_audit"]=="PASS"
          assert d["vulnerable_count"] >= 4
          print("Second-redteam reproduced material weaknesses:", d["vulnerable_count"])
          PY

      - name: Compile red-team harness
        run: python -m compileall -q research/fm04

      - name: Diff check
        run: git diff --check
