name: A02 Archive Recovery Guard

on:
  pull_request:
    paths:
      - "research/a02_raw/acquire_raw_sources.py"
      - ".github/workflows/a02_archive_recovery_guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q research/a02_raw
      - run: git diff --check
