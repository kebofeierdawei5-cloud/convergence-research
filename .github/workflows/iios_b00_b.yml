name: IIOS B00-B — Authority Threat Reproduction

on:
  pull_request:
    paths:
      - "iios_mvp/**"
      - "tests/test_b00_b_authority_threat_reproduction.py"
      - "tests/test_core04_real_300750_upstream_gate_e2e.py"
      - "tests/test_decision_lifecycle_production.py"
      - ".github/workflows/iios_b00_b.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/**"
      - "tests/test_b00_b_authority_threat_reproduction.py"
      - "tests/test_core04_real_300750_upstream_gate_e2e.py"
      - "tests/test_decision_lifecycle_production.py"
      - ".github/workflows/iios_b00_b.yml"

permissions:
  contents: read

jobs:
  threat-reproduction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests
      - run: PYTHONPATH=. pytest -q tests/test_b00_b_authority_threat_reproduction.py
      - run: git diff --check
