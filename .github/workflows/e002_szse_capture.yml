name: E002 SZSE Primary Evidence Capture Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e002_szse_capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture SZSE primary endpoints
        shell: bash
        env:
          HISTORY_URL: "https://www.szse.cn/api/market/ssjjhq/getHistoryData?cycleType=32&marketId=1&code=300750"
          EOD_URL: "https://www.szse.cn/api/report/ShowReport?SHOWTYPE=xlsx&CATALOGID=1815_stock_snapshot&TABKEY=tab1&txtBeginDate=2026-09-30&txtEndDate=2026-09-30&archiveDate=2026-10-01&random=0.20261005"
        run: |
          set -u
          ROOT="$RUNNER_TEMP/e002_primary"
          mkdir -p "$ROOT"
          printf 'runner_os=%s\ngithub_run_id=%s\ngithub_sha=%s\n' "$RUNNER_OS" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$ROOT/run_context.txt"

          capture() {
            label="$1"
            url="$2"
            out="$3"
            headers="$4"
            set +e
            curl --location --retry 2 --retry-all-errors --max-time 20               -D "$headers"               -H 'Accept: application/json, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, */*'               -H 'Referer: https://www.szse.cn/market/trend/index.html'               -H 'User-Agent: Mozilla/5.0'               -w '\nHTTP_STATUS:%{http_code}\n'               "$url" -o "$out" > "$ROOT/${label}_curl.txt" 2>&1
            rc=$?
            printf 'label=%s\nrc=%s\n' "$label" "$rc" > "$ROOT/${label}_transport.txt"
            wc -c "$out" > "$ROOT/${label}_size.txt" 2>/dev/null || true
            sha256sum "$out" > "$ROOT/${label}_sha256.txt" 2>/dev/null || true
            return 0
          }

          capture history "$HISTORY_URL" "$ROOT/history_response.bin" "$ROOT/history_headers.txt"
          capture eod "$EOD_URL" "$ROOT/eod_response.bin" "$ROOT/eod_headers.txt"

          python - <<'PY'
          import hashlib, json, pathlib, datetime, os, zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"]) / "e002_primary"
          receipt={
              "source_ref":"SZSE:MARKET_DATA",
              "observation_date":"2026-09-30",
              "symbol":"300750",
              "retrieved_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "runner_os":os.environ.get("RUNNER_OS"),
              "github_run_id":os.environ.get("GITHUB_RUN_ID"),
              "github_sha":os.environ.get("GITHUB_SHA"),
              "attempts":{}
          }
          for label, name in [("history","history_response.bin"),("eod","eod_response.bin")]:
              p=root/name
              data=p.read_bytes() if p.exists() else b""
              receipt["attempts"][label]={
                  "size_bytes":len(data),
                  "sha256":hashlib.sha256(data).hexdigest(),
                  "content_type":next((x.strip() for x in (root/f"{label}_headers.txt").read_text(errors="replace").splitlines() if x.lower().startswith("content-type:")), None),
              }
              if label=="history" and data:
                  try:
                      obj=json.loads(data.decode("utf-8",errors="replace"))
                      receipt["attempts"][label]["json_shape"]=type(obj).__name__
                      rows=obj.get("data") if isinstance(obj,dict) else None
                      if isinstance(rows,list):
                          for row in rows:
                              if isinstance(row,list) and row and str(row[0]).startswith("2026-09-30") and len(row)>=3:
                                  receipt["attempts"][label]["target_row"]=row
                                  receipt["attempts"][label]["close"]=str(row[2])
                                  if str(row[2])=="291.11":
                                      receipt["status"]="PASS"
                  except Exception as e:
                      receipt["attempts"][label]["json_error"]=repr(e)
              if label=="eod" and data[:2]==b"PK" and zipfile.is_zipfile(p):
                  receipt["attempts"][label]["xlsx_valid"]=True
          if receipt.get("status")=="PASS":
              receipt["admission_candidate"]="PRIMARY_OFFICIAL_RAW_CAPTURE"
          else:
              receipt["admission_candidate"]="BLOCKED"
          (root/"E002_CAPTURE_RECEIPT.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Upload raw E002 capture attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E002-primary-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/e002_primary
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
