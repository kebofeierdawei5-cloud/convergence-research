name: IIOS TR-03 Validation Replay

on:
  pull_request:
    paths:
      - "iios_mvp/validation_replay.py"
      - "iios_mvp/store.py"
      - "iios_mvp/cli.py"
      - "iios_mvp/monitoring_state.py"
      - "schemas/monitoring_initialization_v0.1.schema.json"
      - "schemas/monitoring_evaluation_v0.1.schema.json"
      - "schemas/validation_record_v0.1.schema.json"
      - "tests/test_validation_replay.py"
      - "tests/test_monitoring_state.py"
      - "tests/test_trigger_production.py"
      - "docs/iios/TR_03_VALIDATION_REPLAY_v0.1.md"
      - ".github/workflows/iios_tr_03.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/validation_replay.py"
      - "iios_mvp/store.py"
      - "iios_mvp/cli.py"
      - "iios_mvp/monitoring_state.py"
      - "schemas/monitoring_initialization_v0.1.schema.json"
      - "schemas/monitoring_evaluation_v0.1.schema.json"
      - "schemas/validation_record_v0.1.schema.json"
      - "tests/test_validation_replay.py"
      - "tests/test_monitoring_state.py"
      - "tests/test_trigger_production.py"
      - "docs/iios/TR_03_VALIDATION_REPLAY_v0.1.md"
      - ".github/workflows/iios_tr_03.yml"

permissions:
  contents: read

jobs:
  tr-03:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests
      - run: python -m pytest -q tests/test_trigger_production.py tests/test_monitoring_state.py tests/test_validation_replay.py
      - run: python -m json.tool schemas/monitoring_initialization_v0.1.schema.json >/dev/null
      - run: python -m json.tool schemas/monitoring_evaluation_v0.1.schema.json >/dev/null
      - run: python -m json.tool schemas/validation_record_v0.1.schema.json >/dev/null
      - run: git diff --check
