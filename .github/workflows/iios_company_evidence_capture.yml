name: IIOS Company Evidence Capture (Free-First)

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Case manifest path under manifests/company_cases/"
        required: true
        type: string
        default: "manifests/company_cases/RC-CN-A-002001-20261009.json"
  push:
    branches:
      - "route-a-capture/**"
    paths:
      - "manifests/capture_requests/**"

permissions:
  contents: read

jobs:
  capture-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve and constrain manifest path
        id: resolve_manifest
        env:
          INPUT_MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          manifest_path = os.environ.get("INPUT_MANIFEST_PATH", "").strip()
          expected_case_id = ""
          if not manifest_path:
              request_root = root / "manifests" / "capture_requests"
              request_files = sorted(request_root.glob("*.json")) if request_root.is_dir() else []
              if len(request_files) != 1:
                  raise SystemExit("CAPTURE_REQUEST_MUST_NAME_EXACTLY_ONE_REQUEST_FILE")
              request = json.loads(request_files[0].read_text(encoding="utf-8"))
              if request.get("schema_version") != "IIOS-COMPANY-EVIDENCE-CAPTURE-REQUEST-0.1":
                  raise SystemExit("CAPTURE_REQUEST_SCHEMA_UNSUPPORTED")
              manifest_path = str(request.get("manifest_path", "")).strip()
              expected_case_id = str(request.get("case_id", "")).strip()

          candidate = Path(manifest_path)
          normalized = candidate.as_posix()
          if (
              candidate.is_absolute()
              or ".." in candidate.parts
              or not normalized.startswith("manifests/company_cases/")
              or not normalized.endswith(".json")
              or any(ord(ch) < 32 for ch in normalized)
          ):
              raise SystemExit("MANIFEST_PATH_OUTSIDE_ALLOWED_DIRECTORY")
          resolved = (root / candidate).resolve()
          if root not in resolved.parents or not resolved.is_file():
              raise SystemExit("MANIFEST_PATH_MISSING_OR_ESCAPES_REPOSITORY")
          if expected_case_id:
              manifest = json.loads(resolved.read_text(encoding="utf-8"))
              if manifest.get("case_id") != expected_case_id:
                  raise SystemExit("CAPTURE_REQUEST_CASE_ID_MISMATCH")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"path={normalized}\n")
          print("manifest_path_validated=" + normalized)
          PY

      - name: Capture exact public-source bytes
        id: capture
        continue-on-error: true
        env:
          MANIFEST_PATH: ${{ steps.resolve_manifest.outputs.path }}
          OUT_DIR: ${{ runner.temp }}/iios-company-evidence-${{ github.run_id }}
        run: |
          python tools/company_evidence_intake.py --manifest "$MANIFEST_PATH" --out "$OUT_DIR"

      - name: Independently verify captured bytes and receipt
        id: verify
        if: always()
        env:
          OUT_DIR: ${{ runner.temp }}/iios-company-evidence-${{ github.run_id }}
        run: |
          test -f "$OUT_DIR/COMPANY_EVIDENCE_INTAKE_RECEIPT.json"
          python tools/verify_company_evidence_intake.py --root "$OUT_DIR"

      - name: Upload raw evidence, receipt and verifier result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iios-company-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/iios-company-evidence-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14

      - name: Require complete capture and independent integrity verification
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$CAPTURE_OUTCOME" != "success" ] || [ "$VERIFY_OUTCOME" != "success" ]; then
            echo "CAPTURE_OR_INDEPENDENT_VERIFICATION_FAILED; inspect the uploaded artifact if available."
            exit 1
          fi
          echo "RAW_CAPTURE_AND_INTEGRITY_VERIFICATION_SUCCEEDED_NOT_EVIDENCE_ADMISSION"
