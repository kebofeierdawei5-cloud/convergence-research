name: IIOS Post-B04 Independent Red-team

on:
  push:
    branches:
      - post-b04-independent-redteam
  pull_request:
    paths:
      - "tests/test_post_b04_independent_redteam.py"
      - "iios_mvp/**"
      - "schemas/investment_core_case_v0.3.schema.json"
      - ".github/workflows/iios_post_b04_independent_redteam.yml"
  workflow_dispatch:

jobs:
  post-b04-redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile implementation and independent audit suite
        run: python -m compileall -q iios_mvp tests/test_post_b04_independent_redteam.py
      - name: Run independent authority red-team
        run: python -m pytest -q tests/test_post_b04_independent_redteam.py
      - name: Diff check
        run: git diff --check
