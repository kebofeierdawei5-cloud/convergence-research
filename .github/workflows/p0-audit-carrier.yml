name: P0 Audit Carrier CI

on:
  push:
    branches:
      - audit/p0-r1-r4-ci-20261005

jobs:
  test-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q iios_mvp tests/test_mvp.py tests/test_investment_core_contract.py tests/test_investment_core_v03.py tests/test_market_model_domain.py tests/test_market_model_identification.py tests/test_market_implied_expectation.py tests/test_ratio_market_implied_expectation.py tests/test_dcf_ddm_conditional_market_implied_expectation.py tests/test_sotp_rnpv_market_implied_expectation.py tests/test_multi_model_market_implied_expectation_set.py tests/test_p4f_mie_snapshot.py tests/test_semantic_expectation_gap.py tests/test_core00_scope.py tests/test_research_intake.py tests/test_company_economic_core.py
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m pytest -q tests/test_mvp.py tests/test_value_core.py tests/test_investment_core_contract.py tests/test_investment_core_v03.py tests/test_market_model_domain.py tests/test_market_model_identification.py tests/test_market_implied_expectation.py tests/test_ratio_market_implied_expectation.py tests/test_dcf_ddm_conditional_market_implied_expectation.py tests/test_sotp_rnpv_market_implied_expectation.py tests/test_multi_model_market_implied_expectation_set.py tests/test_p4f_mie_snapshot.py tests/test_semantic_expectation_gap.py tests/test_core00_scope.py tests/test_research_intake.py tests/test_company_economic_core.py
      - run: python -m json.tool schemas/investment_core_case_v0.3.schema.json >/dev/null
