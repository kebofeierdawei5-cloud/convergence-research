name: IIOS M1.2 FM01 Exact CATL Source Admission

on:
  pull_request:
    paths:
      - "research/fm01/**"
      - "research/fm02/**"
      - "research/fm00/OU-M12-FM00-CATL-001.json"
      - ".github/workflows/iios_m12_fm01_source_admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fm01-source-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FM01 dependency
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"
      - name: Validate DriverSeries
        run: python research/fm01/fm01_validator.py research/fm01/CATL_DRIVER_HISTORY.ndjson
      - name: Run independent PIT replay
        run: python research/fm01/fm01_source_admission_replay.py
      - name: Verify admission invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sm = json.loads(Path("research/fm01/M1_1_EXACT_SOURCE_SNAPSHOT_MANIFEST.json").read_text())
          adm = json.loads(Path("research/fm01/M1_1_SOURCE_ADMISSION.json").read_text())
          ds = Path("research/fm01/CATL_DRIVER_HISTORY.ndjson").read_text().splitlines()
          assert sm["status"] == "ADMITTED"
          assert adm["status"] == "PASS"
          assert sm["exact_bytes_verification"]["quarterly_observation_count"] == 22
          assert len(ds) == 44
          assert adm["accepted_dataset"]["unique_quarters"] == 22
          print("FM01 exact source admission invariants: PASS")
          PY
      - name: Compile FM01
        run: python -m compileall -q research/fm01
      - name: Diff check
        run: git diff --check


  verify-fm02-feature-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FM02 validation dependency
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"
      - name: Validate FM02 feature contract schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path("research/fm02")
          schema = json.loads((root / "fm02_feature_contract.schema.json").read_text())
          contract = json.loads((root / "FM02_FEATURE_CONTRACT.json").read_text())
          errors = sorted(Draft202012Validator(schema).iter_errors(contract), key=lambda e: list(e.path))
          assert not errors, "\\n".join(str(e) for e in errors)
          assert contract["status"] == "FROZEN"
          assert contract["confirmatory_eligible"] is False
          assert contract["capability_boundary"]["state_engine"] is False
          assert contract["capability_boundary"]["conditional_backtest"] is False
          assert contract["capability_boundary"]["model_selection"] is False
          assert contract["capability_boundary"]["production_router"] is False
          assert contract["capability_boundary"]["automatic_execution"] is False
          print("FM02 feature contract schema/boundary: PASS")
          PY
      - name: Run FM02 unit tests
        run: python -m unittest discover -s research/fm02/tests -p 'test_*.py' -v
      - name: Build FM02 PIT feature snapshot
        run: |
          python research/fm02/fm02_feature_builder.py \\
            --output /tmp/FM02_FEATURE_SNAPSHOT.ndjson \\
            --receipt /tmp/FM02_FEATURE_BUILD_RECEIPT.json
      - name: Validate generated FM02 snapshot schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("research/fm02/fm02_feature_snapshot.schema.json").read_text())
          validator = Draft202012Validator(schema)
          rows = [
              json.loads(line)
              for line in Path("/tmp/FM02_FEATURE_SNAPSHOT.ndjson").read_text().splitlines()
              if line.strip()
          ]
          errors = []
          for index, row in enumerate(rows):
              for issue in validator.iter_errors(row):
                  path = ".".join(str(x) for x in issue.path) or "$"
                  errors.append(f"row[{index}] {path}: {issue.message}")
          assert not errors, "\\n".join(errors)
          assert len(rows) == 22
          print("FM02 generated snapshot schema: PASS")
          PY

      - name: Verify FM02 build receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("/tmp/FM02_FEATURE_BUILD_RECEIPT.json").read_text())
          assert receipt["status"] == "PASS"
          assert receipt["row_count"] == 22
          assert receipt["origin_count"] == 11
          assert receipt["confirmatory_eligible"] is False
          assert receipt["feature_ids"] == [
              "YOY_GROWTH",
              "GROWTH_ACCELERATION",
              "ROLLING_GROWTH_VOL",
              "SEASONAL_DEVIATION",
              "MEAN_REVERSION_GAP",
              "SLOPE_STABILITY",
          ]
          print("FM02 build receipt: PASS")
          PY
      - name: Independent FM02 PIT provenance audit
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          def qkey(period):
              return int(period[:4]), int(period[-1])

          def qadd(period, offset):
              year, quarter = qkey(period)
              serial = year * 4 + quarter - 1 + offset
              return f"{serial // 4}Q{serial % 4 + 1}"

          records = {}
          for line in Path("research/fm01/CATL_DRIVER_HISTORY.ndjson").read_text().splitlines():
              rec = json.loads(line)
              records[rec["record_id"]] = rec
          rows = [
              json.loads(line)
              for line in Path("/tmp/FM02_FEATURE_SNAPSHOT.ndjson").read_text().splitlines()
              if line.strip()
          ]
          assert len(rows) == 22
          offsets = {"3M": 1, "6M": 2, "12M": 4}
          for row in rows:
              cutoff = datetime.fromisoformat(row["origin_cutoff"])
              for feature in row["features"].values():
                  for record_id in feature["input_record_ids"]:
                      assert record_id in records
                      rec = records[record_id]
                      assert datetime.fromisoformat(rec["known_at"]) <= cutoff
                      for offset in offsets.values():
                          assert qkey(rec["period"]) < qkey(qadd(row["origin_id"], offset))
              for offset in offsets.values():
                  assert qkey(row["feature_asof_period"]) < qkey(qadd(row["origin_id"], offset))
          print("FM02 independent PIT provenance audit: PASS")
          PY
      - name: Compile FM02
        run: python -m compileall -q research/fm02
      - name: Diff check
        run: git diff --check
