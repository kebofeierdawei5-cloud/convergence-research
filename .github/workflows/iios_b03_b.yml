name: IIOS B03-B Mandatory Upstream Authority

on:
  pull_request:
    paths:
      - "iios_mvp/engine.py"
      - "iios_mvp/investment_core_contract_v03.py"
      - "iios_mvp/decision_upstream_admission_v03.py"
      - "iios_mvp/upstream_authority_v03.py"
      - "tests/b03b_upstream_authority_fixture.py"
      - "tests/test_b03_b_mandatory_upstream_authority.py"
      - "tests/test_b00_b_authority_threat_reproduction.py"
      - "tests/test_investment_core_v03.py"
      - "tests/test_core04_real_300750_upstream_gate_e2e.py"
      - "tools/core04_final_300750_decision_e2e.py"
      - "tools/c3_kolun_second_company_e2e.py"
      - ".github/workflows/iios_b03_b.yml"
  workflow_dispatch:

jobs:
  b03-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile implementation and migrated fixtures
        run: python -m compileall -q iios_mvp tests tools
      - name: Run B03-B authority regressions
        run: python -m pytest -q tests/test_b03_b_mandatory_upstream_authority.py tests/test_b00_b_authority_threat_reproduction.py tests/test_investment_core_v03.py tests/test_core04_real_300750_upstream_gate_e2e.py tests/test_c3_kolun_second_company_e2e.py tests/test_core04_final_300750_decision_e2e.py
      - name: Diff check
        run: git diff --check
