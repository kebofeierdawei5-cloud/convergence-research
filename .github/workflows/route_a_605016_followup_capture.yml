name: Route A 605016 Official Follow-up Capture
on:
  pull_request:
    paths:
      - "tools/route_a_605016_followup_capture.py"
      - ".github/workflows/route_a_605016_followup_capture.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-public-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture public official SSE notice and free market-data cross-check
        run: python tools/route_a_605016_followup_capture.py /tmp/605016-followup
      - name: Upload raw follow-up bytes and provenance report for review
        uses: actions/upload-artifact@v4
        with:
          name: route-a-605016-followup-capture
          path: /tmp/605016-followup/
          if-no-files-found: error
          retention-days: 14
