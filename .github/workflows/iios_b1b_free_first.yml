name: IIOS B1B Free-First PIT Evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/iios_b1b_free_first.yml"
      - "research/a02_b1b/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free-source clients
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5 baostock==0.9.3 pandas==2.3.3
      - name: Materialize B1-B free-first evidence
        continue-on-error: true
        run: python research/a02_b1b/materialize_free_pit.py --out "$RUNNER_TEMP/b1b"
      - name: Hash captured evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/b1b"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256_MANIFEST.txt
          printf 'repository=%s\nrun_id=%s\nsha=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > GITHUB_RUN_CONTEXT.txt
      - name: Upload B1-B evidence packet
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: IIOS-B1B-free-first-${{ github.run_id }}
          path: ${{ runner.temp }}/b1b
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Report field admission
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cat "${{ runner.temp }}/b1b/B1B_FIELD_ADMISSION_MATRIX.json"