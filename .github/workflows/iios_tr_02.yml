name: IIOS TR-02 Monitoring State

on:
  pull_request:
    paths:
      - "iios_mvp/monitoring_state.py"
      - "iios_mvp/trigger_production.py"
      - "iios_mvp/store.py"
      - "iios_mvp/cli.py"
      - "schemas/monitoring_state_v0.1.schema.json"
      - "tests/test_monitoring_state.py"
      - ".github/workflows/iios_tr_02.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/monitoring_state.py"
      - "iios_mvp/trigger_production.py"
      - "iios_mvp/store.py"
      - "iios_mvp/cli.py"
      - "schemas/monitoring_state_v0.1.schema.json"
      - "tests/test_monitoring_state.py"
      - ".github/workflows/iios_tr_02.yml"

permissions:
  contents: read

jobs:
  tr-02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests/test_monitoring_state.py
      - run: python -m pytest -q tests/test_monitoring_state.py
      - run: python -m json.tool schemas/monitoring_state_v0.1.schema.json >/dev/null
      - run: git diff --check
