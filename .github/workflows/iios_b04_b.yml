name: IIOS B04-B Mandatory Forecast-Valuation-Return Lineage

on:
  pull_request:
    paths:
      - "iios_mvp/investment_core_contract_v03.py"
      - "iios_mvp/forecast_valuation_return_lineage_v01.py"
      - "iios_mvp/decision_admission.py"
      - "schemas/investment_core_case_v0.3.schema.json"
      - "tests/b04b_return_lineage_fixture.py"
      - "tests/test_b04_b_mandatory_return_lineage.py"
      - "tests/test_b04_*.py"
      - "tests/test_investment_core_v03.py"
      - "tests/test_price_dependent_expectation_gap.py"
      - "tests/test_canonical_entry_evaluation.py"
      - "tests/test_c4_expectation_gap_production.py"
      - "tests/test_c5_positioning_sizing_production.py"
      - "tests/test_core04_real_300750_upstream_gate_e2e.py"
      - "tools/core04_final_300750_decision_e2e.py"
      - "tools/c3_kolun_second_company_e2e.py"
      - "tests/test_c8_auth_remediation.py"
      - ".github/workflows/iios_b04_b.yml"
  workflow_dispatch:

# B04-B verification is canonical-head scoped.
jobs:
  b04-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile implementation and migrated fixtures
        run: python -m compileall -q iios_mvp tests tools
      - name: Validate B04-B schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open("schemas/investment_core_case_v0.3.schema.json", encoding="utf-8") as f:
              schema = json.load(f)
          Draft202012Validator.check_schema(schema)
          rg = schema["properties"]["return_gate"]
          required = set(rg["required"])
          expected = {
              "lineage_version",
              "canonical_forecast_ref",
              "canonical_valuation_ref",
          }
          assert expected.issubset(required), (required, expected)
          print("B04-B schema mandatory lineage: PASS")
          PY
      - name: Run B04-B mandatory lineage regressions
        run: python -m pytest -q tests/test_b04_b_mandatory_return_lineage.py tests/test_b04_forecast_valuation_return_lineage.py tests/test_b04_core_integration.py tests/test_investment_core_v03.py tests/test_price_dependent_expectation_gap.py tests/test_canonical_entry_evaluation.py tests/test_c4_expectation_gap_production.py tests/test_c5_positioning_sizing_production.py tests/test_core04_real_300750_upstream_gate_e2e.py tests/test_c8_auth_remediation.py tests/test_c3_kolun_second_company_e2e.py
      - name: Diff check
        run: git diff --check
