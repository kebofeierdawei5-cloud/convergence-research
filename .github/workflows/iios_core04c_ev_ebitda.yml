name: IIOS CORE-04-C 300750 PIT EV EBITDA

on:
  pull_request:
    paths:
      - "tools/core04c_ev_ebitda.py"
      - "tests/test_core04c_ev_ebitda.py"
      - "research/core04c_ev_ebitda_source_manifest_v0.1.json"
      - ".github/workflows/iios_core04c_ev_ebitda.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core04c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pytest pypdf
      - name: Compile and unit test
        run: |
          python -m compileall -q tools tests/test_core04c_ev_ebitda.py
          PYTHONPATH=. python -m pytest -q tests/test_core04c_ev_ebitda.py
          git diff --check
      - name: Capture, parse and admit PIT EV/EBITDA
        run: |
          rm -rf /tmp/core04c
          mkdir -p /tmp/core04c/raw /tmp/core04c/out
          PYTHONPATH=. python tools/core04c_ev_ebitda.py \
            --download \
            --source-dir /tmp/core04c/raw \
            --out /tmp/core04c/out \
            --symbol 300750 \
            | tee /tmp/core04c/out/core04c_run_result.json
      - name: Re-verify generated JSON
        run: |
          python -m json.tool /tmp/core04c/out/core04c_derivation.json >/dev/null
          python -m json.tool /tmp/core04c/out/core04c_ev_ebitda_admission.json >/dev/null
          python -m json.tool /tmp/core04c/out/core04c_run_result.json >/dev/null
      - name: Upload exact source bytes and admission artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iios-core04c-300750-ev-ebitda-${{ github.run_id }}
          path: /tmp/core04c
          retention-days: 7
