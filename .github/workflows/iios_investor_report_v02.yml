name: IIOS Investor Review Report v0.2

on:
  pull_request:
    paths:
      - "iios_mvp/investor_review_report_v02.py"
      - "iios_mvp/cli.py"
      - "schemas/investor_review_report_v0.2.schema.json"
      - "schemas/investor_review_qa_v0.2.schema.json"
      - "tests/test_investor_review_report_v02.py"
      - "tests/independent_redteam_investor_review_v02.py"
      - "docs/iios/INVESTOR_REVIEW_V02_REDTEAM_XHC_2_20261008.md"
      - "docs/iios/INVESTOR_REVIEW_REPORT_v0.2.md"
      - "docs/iios/INVESTOR_REVIEW_HUMAN_AUDITABILITY_CONTRACT_v0.2.md"
      - "schemas/human_auditability_v0.2.schema.json"
      - ".github/workflows/iios_investor_report_v02.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/investor_review_report_v02.py"
      - "iios_mvp/cli.py"
      - "schemas/investor_review_report_v0.2.schema.json"
      - "schemas/investor_review_qa_v0.2.schema.json"
      - "tests/test_investor_review_report_v02.py"
      - "docs/iios/INVESTOR_REVIEW_REPORT_v0.2.md"
      - ".github/workflows/iios_investor_report_v02.yml"

permissions:
  contents: read
  actions: read

jobs:
  investor-report-v02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests
      - run: python -m pytest -q tests/test_investor_review_report_v02.py

      - name: Download canonical Xinhecheng Publication evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11529920007
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37730232684
          path: /tmp/iios-xhc/artifact


      - name: Verify legacy Xinhecheng Publication is blocked without a current canonical run receipt
        run: |
          set -euo pipefail
          pub="$(find /tmp/iios-xhc/artifact -type f -name '7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0.publication.json' -print -quit)"
          test -n "$pub" || { find /tmp/iios-xhc/artifact -maxdepth 5 -type f -print; exit 1; }
          publication_file_sha256="$(sha256sum "$pub" | awk '{print $1}')"
          python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); assert p.get("publication_hash")=="7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0"; print("PUBLICATION_HASH_FIELD_VERIFIED; file_sha256="+sys.argv[2])' "$pub" "$publication_file_sha256"
          rm -rf /tmp/iios-xhc/formal-writer
          mkdir -p /tmp/iios-xhc/formal-writer/out
          python - <<'PY'
          import json
          from pathlib import Path
          from iios_mvp.investor_review_report_v02 import write_investor_review_report_v02

          publication_path = Path("/tmp/iios-xhc/artifact/iios-pilot02-xinhecheng-20261007/out/7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0.publication.json")
          output = Path("/tmp/iios-xhc/formal-writer/out")
          try:
              write_investor_review_report_v02(
                  str(output),
                  publication_path=str(publication_path),
                  generated_at="2026-10-08T05:00:00+00:00",
              )
          except ValueError as exc:
              if "CANONICAL_RUN_AUTHORIZATION_BLOCKED" not in str(exc):
                  raise
              receipt = {
                  "status": "BLOCKED_LEGACY_PUBLICATION",
                  "publication_hash": "7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0",
                  "reason_code": "CANONICAL_RUN_AUTHORIZATION_BLOCKED",
                  "reason": str(exc),
                  "report_written": False,
                  "decision_or_economics_mutated": False,
                  "provider_endpoint_required": False,
                  "provider_api_key_required": False,
                  "note": "This legacy publication does not carry the new persisted canonical-run authorization receipt. No fresh formal report was generated."
              }
              (output / "LEGACY_PUBLICATION_REAUTHORIZATION_BLOCKED.json").write_text(
                  json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True))
          else:
              raise SystemExit("Expected legacy publication to be blocked until canonical run lineage is re-established")
          PY

      - name: Assert legacy Publication was not relabeled canonical
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/iios-xhc/formal-writer/out")
          receipt=json.loads((root/"LEGACY_PUBLICATION_REAUTHORIZATION_BLOCKED.json").read_text(encoding="utf-8"))
          assert receipt["status"]=="BLOCKED_LEGACY_PUBLICATION"
          assert receipt["reason_code"]=="CANONICAL_RUN_AUTHORIZATION_BLOCKED"
          assert receipt["report_written"] is False
          assert receipt["decision_or_economics_mutated"] is False
          assert receipt["provider_endpoint_required"] is False
          assert receipt["provider_api_key_required"] is False
          assert not list(root.glob("*.investor-review-v02.json"))
          print("LEGACY_PUBLICATION_REAUTHORIZATION_BLOCKED_AS_REQUIRED")
          PY

      - name: Upload legacy reauthorization blocker receipt
        uses: actions/upload-artifact@v4
        with:
          name: iios-investor-review-v02-legacy-publication-blocked
          path: /tmp/iios-xhc/formal-writer/out/LEGACY_PUBLICATION_REAUTHORIZATION_BLOCKED.json
          if-no-files-found: error

      - run: python -m json.tool schemas/investor_review_report_v0.2.schema.json >/dev/null
      - run: python -m json.tool schemas/investor_review_qa_v0.2.schema.json >/dev/null
      - run: python -m json.tool schemas/human_auditability_v0.2.schema.json >/dev/null
      - run: git diff --check
