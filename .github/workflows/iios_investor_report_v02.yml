name: IIOS Investor Review Report v0.2

on:
  pull_request:
    paths:
      - "iios_mvp/investor_review_report_v02.py"
      - "iios_mvp/cli.py"
      - "iios_mvp/machine_publication.py"
      - "iios_mvp/canonical_run_authority_v01.py"
      - "schemas/investor_review_report_v0.2.schema.json"
      - "schemas/investor_review_qa_v0.2.schema.json"
      - "tests/test_investor_review_report_v02.py"
      - "tests/independent_redteam_investor_review_v02.py"
      - "docs/iios/INVESTOR_REVIEW_V02_REDTEAM_XHC_2_20261008.md"
      - "docs/iios/INVESTOR_REVIEW_REPORT_v0.2.md"
      - "docs/iios/INVESTOR_REVIEW_HUMAN_AUDITABILITY_CONTRACT_v0.2.md"
      - "schemas/human_auditability_v0.2.schema.json"
      - ".github/workflows/iios_investor_report_v02.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/investor_review_report_v02.py"
      - "iios_mvp/cli.py"
      - "iios_mvp/machine_publication.py"
      - "iios_mvp/canonical_run_authority_v01.py"
      - "schemas/investor_review_report_v0.2.schema.json"
      - "schemas/investor_review_qa_v0.2.schema.json"
      - "tests/test_investor_review_report_v02.py"
      - "docs/iios/INVESTOR_REVIEW_REPORT_v0.2.md"
      - ".github/workflows/iios_investor_report_v02.yml"

permissions:
  contents: read
  actions: read

jobs:
  investor-report-v02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests
      - run: python -m pytest -q tests/test_investor_review_report_v02.py

      # This is an older publication artifact captured before P0 run receipts
      # became mandatory. It must now be rejected, not re-rendered as if it
      # carried a current canonical Run Envelope.
      - name: Download historical Xinhecheng Publication evidence
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11529920007
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37730232684
          path: /tmp/iios-xhc/artifact

      - name: Assert historical Xinhecheng Publication is rejected without run authority
        run: |
          set -euo pipefail
          pub=/tmp/iios-xhc/artifact/iios-pilot02-xinhecheng-20261007/out/7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0.publication.json
          test -f "$pub"
          test "$(sha256sum "$pub" | awk '{print $1}')" = "7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0"
          rm -rf /tmp/iios-xhc/formal-writer
          mkdir -p /tmp/iios-xhc/formal-writer/out
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from iios_mvp.investor_review_report_v02 import write_investor_review_report_v02

          pub = Path("/tmp/iios-xhc/artifact/iios-pilot02-xinhecheng-20261007/out/7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0.publication.json")
          out = Path("/tmp/iios-xhc/formal-writer/out")
          payload = pub.read_bytes()
          receipt = {
              "status": "BLOCKED",
              "classification": "NON_CANONICAL",
              "reason": "historical Publication predates persisted Run Envelope/Stage Receipt authority",
              "input_publication_sha256": hashlib.sha256(payload).hexdigest(),
              "formal_report_created": False,
          }
          try:
              write_investor_review_report_v02(
                  str(out), publication_path=str(pub),
                  generated_at="2026-10-08T05:00:00+00:00",
              )
          except (ValueError, OSError) as exc:
              receipt["reason"] = str(exc)
              if "Run Envelope/Stage Receipt authority" not in receipt["reason"]:
                  raise SystemExit("Unexpected failure; fail-closed classification missing: " + receipt["reason"])
          else:
              raise SystemExit("P0 REGRESSION: a Publication without canonical run authority produced a formal report")
          if list(out.glob("*.investor-review-v02.json")) or list(out.glob("*.investor-review-v02.machine.json")) or list(out.glob("*.investor-review-v02.md")) or list(out.glob("*.investor-review-v02-qa.json")):
              raise SystemExit("P0 REGRESSION: blocked write left formal report side effects")
          (Path("/tmp/iios-xhc/formal-writer") / "blocked-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload rejection evidence for historical Publication
        uses: actions/upload-artifact@v4
        with:
          name: iios-investor-review-v02-rejected-historical-xinhecheng
          path: /tmp/iios-xhc/formal-writer/blocked-receipt.json
          if-no-files-found: error

      - run: python -m json.tool schemas/investor_review_report_v0.2.schema.json >/dev/null
      - run: python -m json.tool schemas/investor_review_qa_v0.2.schema.json >/dev/null
      - run: python -m json.tool schemas/human_auditability_v0.2.schema.json >/dev/null
      - run: git diff --check
