name: IIOS Investor Review Report v0.2

on:
  pull_request:
    paths:
      - "iios_mvp/investor_review_report_v02.py"
      - "iios_mvp/cli.py"
      - "schemas/investor_review_report_v0.2.schema.json"
      - "schemas/investor_review_qa_v0.2.schema.json"
      - "tests/test_investor_review_report_v02.py"
      - "docs/iios/INVESTOR_REVIEW_REPORT_v0.2.md"
      - "docs/iios/INVESTOR_REVIEW_HUMAN_AUDITABILITY_CONTRACT_v0.2.md"
      - "schemas/human_auditability_v0.2.schema.json"
      - ".github/workflows/iios_investor_report_v02.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/investor_review_report_v02.py"
      - "iios_mvp/cli.py"
      - "schemas/investor_review_report_v0.2.schema.json"
      - "schemas/investor_review_qa_v0.2.schema.json"
      - "tests/test_investor_review_report_v02.py"
      - "docs/iios/INVESTOR_REVIEW_REPORT_v0.2.md"
      - ".github/workflows/iios_investor_report_v02.yml"

permissions:
  contents: read
  actions: read

jobs:
  investor-report-v02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        if: github.event_name == 'pull_request'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests
      - name: Diagnose fixture publication hash before pytest
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from tests.test_investor_review_report_v02 import _snapshot
          from tests.decision_admission_fixture import build_fixture_admission_receipt
          from iios_mvp.engine import sha256_obj
          from iios_mvp.machine_publication import build_machine_publication
          from iios_mvp.store import create_or_load_series, write_decision_revision, write_snapshot
          from iios_mvp.investor_review_report_v02 import (
              build_investor_review_report_v02,
              validate_investor_review_report_v02,
              qa_investor_review_v02,
              validate_investor_review_qa_v02,
          )

          def make_publication(run_id):
              td = TemporaryDirectory()
              root = Path(td.name)
              snapshot = _snapshot()
              write_snapshot(root, snapshot)
              series = create_or_load_series(
                  root, "CN-A", "300750", "CATL", "2026-10-08T00:00:00+00:00"
              )
              write_decision_revision(
                  root,
                  series["decision_series_id"],
                  1,
                  snapshot,
                  run_id,
                  decision_admission=build_fixture_admission_receipt(
                      snapshot=snapshot, canonical_decision=snapshot["decision"]
                  ),
              )
              return td, build_machine_publication(
                  root=root,
                  decision_id="CN-A-300750-r001",
                  published_at="2026-10-08T01:00:00+00:00",
              )

          first_td, first_publication = make_publication("run-v02-diagnostic-1")
          expected_first = sha256_obj({
              k: first_publication[k]
              for k in first_publication
              if k not in {"publication_id", "publication_hash"}
          })
          print("first_hash_equal=", first_publication["publication_hash"] == expected_first)
          first_report = build_investor_review_report_v02(
              publication=first_publication, generated_at="2026-10-08T02:00:00+00:00"
          )
          validate_investor_review_report_v02(first_report)
          first_qa = qa_investor_review_v02(publication=first_publication, report=first_report)
          validate_investor_review_qa_v02(first_qa)
          print("first_report_qa_status=", first_qa["qa_status"])

          second_td, second_publication = make_publication("run-v02-diagnostic-2")
          expected_second = sha256_obj({
              k: second_publication[k]
              for k in second_publication
              if k not in {"publication_id", "publication_hash"}
          })
          print("second_hash_equal=", second_publication["publication_hash"] == expected_second)
          print("cross_test_publication_build_equal=", first_publication["publication_hash"] != second_publication["publication_hash"])
          PY
      - run: python -m pytest -q tests/test_investor_review_report_v02.py
      - name: Re-render canonical Xinhecheng Publication through Investor Review v0.2
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11529920007
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37730232684
          path: /tmp/iios-xhc/artifact

      - name: Validate and render canonical Xinhecheng Publication through Investor Review v0.2
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/iios-xhc/rendered
          pub=/tmp/iios-xhc/artifact/iios-pilot02-xinhecheng-20261007/out/7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0.publication.json
          test -f "$pub"
          test "$(sha256sum "$pub" | awk '{print $1}')" = "7e9bc390c03e12ac3309754cdb65938aa928d9dea97a4145998e3ab9911a0ea0"
          set +e
          python -m iios_mvp.cli investor-report-v02 "$pub" \
            --generated-at "2026-10-08T05:00:00+00:00" \
            --out /tmp/iios-xhc/rendered 2>&1 | tee /tmp/iios-xhc/cli.txt
          cli_rc=${PIPESTATUS[0]}
          set -e
          echo "cli_rc=${cli_rc}" | tee -a /tmp/iios-xhc/cli.txt
          mkdir -p ci-evidence
          cp /tmp/iios-xhc/cli.txt ci-evidence/real-xinhecheng-cli.txt
          printf '%s  %s\\n' "$pub" "$(sha256sum "$pub" | awk '{print $1}')" > ci-evidence/publication-sha256.txt
          test "${cli_rc}" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/iios-xhc/rendered")
          report=json.loads(next(root.glob("*.investor-review-v02.json")).read_text())
          audit=report["machine_report"]["semantic_surface"]["human_auditability"]
          print(json.dumps({
              "report_id": report["report_id"],
              "report_hash": report["report_hash"],
              "publication_hash": report["publication_hash"],
              "overall_status": audit["overall_status"],
              "required_return": audit["required_return"],
              "expected_return": audit["expected_return"],
              "scenario_probability": audit["scenario_probability"],
              "entry_price": audit["entry_price"],
              "portfolio_permission": audit["portfolio_permission"],
              "mie_expectation_gap": audit["mie_expectation_gap"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload real Xinhecheng v0.2 rerender artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iios-investor-review-v02-xinhecheng
          path: ci-evidence/
          if-no-files-found: warn

      - run: python -m json.tool schemas/investor_review_report_v0.2.schema.json >/dev/null
      - run: python -m json.tool schemas/investor_review_qa_v0.2.schema.json >/dev/null
      - run: python -m json.tool schemas/human_auditability_v0.2.schema.json >/dev/null
      - run: git diff --check
