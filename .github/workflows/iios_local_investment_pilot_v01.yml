name: IIOS Local Investment Pilot v0.1

on:
  pull_request:
    paths:
      - "iios_mvp/local_investment_pilot_v01.py"
      - "iios_mvp/research_intake.py"
      - "iios_mvp/investment_core_contract_v03.py"
      - "tests/test_local_investment_pilot_v01.py"
      - ".github/workflows/iios_local_investment_pilot_v01.yml"
      - "docs/iios/LOCAL_INVESTMENT_PILOT_V01_GUIDE_20261011.md"
      - "启动IIOS投资分析.command"
      - "启动IIOS投资分析.command"
  push:
    branches: [main]
    paths:
      - "iios_mvp/local_investment_pilot_v01.py"
      - "iios_mvp/research_intake.py"
      - "iios_mvp/investment_core_contract_v03.py"
      - "tests/test_local_investment_pilot_v01.py"
      - ".github/workflows/iios_local_investment_pilot_v01.yml"
      - "docs/iios/LOCAL_INVESTMENT_PILOT_V01_GUIDE_20261011.md"

permissions:
  contents: read

jobs:
  local-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact PR head checkout
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile the local pilot and reused IIOS core
        run: python -m compileall -q iios_mvp/local_investment_pilot_v01.py iios_mvp/research_intake.py iios_mvp/investment_core_contract_v03.py
      - name: Run local pilot vertical-slice tests
        run: PYTHONPATH=. python -m pytest -q tests/test_local_investment_pilot_v01.py
      - name: Check diff formatting
        run: git diff --check
