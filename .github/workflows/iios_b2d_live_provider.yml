name: IIOS B2-D Live Provider Preflight

on:
  pull_request:
    paths:
      - "iios_mvp/live_provider_preflight_v01.py"
      - "iios_mvp/live_provider_invocation_v01.py"
      - "iios_mvp/live_provider_replay_v01.py"
      - "schemas/live_provider_replay_v0.1.schema.json"
      - "tests/test_b2d_live_provider_preflight.py"
      - "tests/independent_redteam_b2d_live_provider.py"
      - "docs/iios/B2_D_LIVE_PROVIDER_PREFLIGHT_20261008.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run B2-D preflight tests
        run: |
          python -m pip install --disable-pip-version-check pytest jsonschema cryptography
          python -m pytest -q tests/test_b2d_live_provider_preflight.py
      - name: Run independent B2-D clean-room red-team
        run: python -m pytest -q tests/independent_redteam_b2d_live_provider.py
      - name: Compile B2-D
        run: python -m compileall -q iios_mvp/live_provider_preflight_v01.py iios_mvp/live_provider_invocation_v01.py iios_mvp/live_provider_replay_v01.py
      - name: Validate replay schema
        run: python -m json.tool schemas/live_provider_replay_v0.1.schema.json >/dev/null
      - name: Diff check
        run: git diff --check
