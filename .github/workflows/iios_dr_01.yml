name: IIOS DR-01 Decision Lifecycle Contract

on:
  pull_request:
    paths:
      - "iios_mvp/decision_lifecycle_production.py"
      - "schemas/decision_lifecycle_v0.1.schema.json"
      - "tests/test_decision_lifecycle_production.py"
      - ".github/workflows/iios_dr_01.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/decision_lifecycle_production.py"
      - "schemas/decision_lifecycle_v0.1.schema.json"
      - "tests/test_decision_lifecycle_production.py"
      - ".github/workflows/iios_dr_01.yml"
permissions:
  contents: read
jobs:
  dr-01:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests/test_decision_lifecycle_production.py
      - run: python -m pytest -q tests/test_decision_lifecycle_production.py
      - run: python -m json.tool schemas/decision_lifecycle_v0.1.schema.json >/dev/null
      - run: git diff --check
