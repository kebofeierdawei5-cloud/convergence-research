name: IIOS CORE-02 Company Economic Core

on:
  pull_request:
    paths:
      - "iios_mvp/company_economic_core.py"
      - "iios_mvp/value_core.py"
      - "iios_mvp/research_intake.py"
      - "iios_mvp/cli.py"
      - "schemas/company_economic_core_v0.1.schema.json"
      - "schemas/research_case_v0.1.schema.json"
      - "tests/test_company_economic_core.py"
      - "tests/test_research_intake.py"
      - "tests/test_value_core.py"
      - "docs/iios/CORE_02_COMPANY_ECONOMIC_CORE_v0.1.md"
      - "docs/iios/CORE_02_ACCEPTANCE_2026-10-04.md"
      - ".github/workflows/iios_core02.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/company_economic_core.py"
      - "iios_mvp/value_core.py"
      - "iios_mvp/research_intake.py"
      - "iios_mvp/cli.py"
      - "schemas/company_economic_core_v0.1.schema.json"
      - "schemas/research_case_v0.1.schema.json"
      - "tests/test_company_economic_core.py"
      - "tests/test_research_intake.py"
      - "tests/test_value_core.py"
      - "docs/iios/CORE_02_COMPANY_ECONOMIC_CORE_v0.1.md"
      - "docs/iios/CORE_02_ACCEPTANCE_2026-10-04.md"
      - ".github/workflows/iios_core02.yml"

permissions:
  contents: read

jobs:
  core02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests/test_company_economic_core.py
      - run: python -m pytest -q tests/test_company_economic_core.py tests/test_research_intake.py tests/test_value_core.py
      - run: python -m json.tool schemas/company_economic_core_v0.1.schema.json >/dev/null
      - run: PYTHONPATH=. python -m iios_mvp.cli intake 300750 --as-of 2026-10-04 --position 0 --generated-at 2026-10-04T00:00:00+00:00
      - run: git diff --check
