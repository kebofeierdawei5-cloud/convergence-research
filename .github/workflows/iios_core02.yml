name: IIOS CORE-02 Company Economic Core

on:
  pull_request:
    paths:
      - "iios_mvp/company_economic_core.py"
      - "iios_mvp/value_core.py"
      - "iios_mvp/research_intake.py"
      - "iios_mvp/cli.py"
      - "schemas/company_economic_core_v0.1.schema.json"
      - "schemas/research_case_v0.1.schema.json"
      - "tests/test_company_economic_core.py"
      - "tests/test_research_intake.py"
      - "tests/test_value_core.py"
      - "examples/real_cases/RC-CN-A-300750-20261004_core02_input.json"
      - "evidence/real_cases/RC-CN-A-300750-20261004/**"
      - "docs/iios/CORE_02_COMPANY_ECONOMIC_CORE_v0.1.md"
      - "docs/iios/CORE_02_ACCEPTANCE_2026-10-04.md"
      - ".github/workflows/iios_core02.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/company_economic_core.py"
      - "iios_mvp/value_core.py"
      - "iios_mvp/research_intake.py"
      - "iios_mvp/cli.py"
      - "schemas/company_economic_core_v0.1.schema.json"
      - "schemas/research_case_v0.1.schema.json"
      - "tests/test_company_economic_core.py"
      - "tests/test_research_intake.py"
      - "tests/test_value_core.py"
      - "examples/real_cases/RC-CN-A-300750-20261004_core02_input.json"
      - "evidence/real_cases/RC-CN-A-300750-20261004/**"
      - "docs/iios/CORE_02_COMPANY_ECONOMIC_CORE_v0.1.md"
      - "docs/iios/CORE_02_ACCEPTANCE_2026-10-04.md"
      - ".github/workflows/iios_core02.yml"

permissions:
  contents: read

jobs:
  core02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m compileall -q iios_mvp tests/test_company_economic_core.py
      - run: python -m pytest -q tests/test_company_economic_core.py tests/test_research_intake.py tests/test_value_core.py
      - run: python -m json.tool schemas/company_economic_core_v0.1.schema.json >/dev/null
      - run: PYTHONPATH=. python -m iios_mvp.cli intake 300750 --as-of 2026-10-04 --position 0 --generated-at 2026-10-04T00:00:00+00:00
      - run: git diff --check

      - run: |
          PYTHONPATH=. python -m iios_mvp.cli economic-core \
            examples/real_cases/RC-CN-A-300750-20261004_core02_input.json \
            --generated-at 2026-10-04T22:00:00+08:00 \
            --out /tmp/RC-CN-A-300750-20261004_core02.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/RC-CN-A-300750-20261004_core02.json")
          core = json.loads(p.read_text(encoding="utf-8"))
          assert core["case_id"] == "RC-CN-A-300750-20261004"
          assert core["status"] == "CONDITIONAL"
          assert core["evidence_admission"]["status"] == "ADMITTED"
          assert core["evidence_admission"]["count"] == 7
          assert core["evidence_admission"]["evidence_ids"] == [f"E{i:03d}" for i in range(1, 8)]
          assert core["value_driver_ranking"][0]["rank"] == 1
          assert core["valuation_route"]["status"] == "CANDIDATE_SET_ONLY"
          print("REAL_300750_CORE02_OK")
          PY
