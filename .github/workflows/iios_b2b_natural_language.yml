name: IIOS B2-B Natural Language Conformance

on:
  pull_request:
    paths:
      - "iios_mvp/canonical_natural_language_entry_v01.py"
      - "schemas/nl_request_admission_v0.1.schema.json"
      - "tests/test_b2b_natural_language_conformance.py"
      - "tests/independent_redteam_b2b_natural_language.py"
      - "docs/iios/B2_B_NATURAL_LANGUAGE_CONFORMANCE_20261008.md"
      - "docs/iios/B2_B_INDEPENDENT_REDTEAM_20261008.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Run B2-B conformance tests
        run: python -m pytest -q tests/test_b2b_natural_language_conformance.py
      - name: Run independent B2-B clean-room red-team
        run: python -m pytest -q tests/independent_redteam_b2b_natural_language.py
      - name: Compile B2-B implementation
        run: python -m compileall -q iios_mvp/canonical_natural_language_entry_v01.py
      - name: Validate B2-B schema
        run: python -m json.tool schemas/nl_request_admission_v0.1.schema.json >/dev/null
      - name: Diff check
        run: git diff --check
