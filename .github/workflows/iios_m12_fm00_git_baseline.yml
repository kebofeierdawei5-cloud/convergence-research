name: IIOS M1.2 FM00 Git Baseline

on:
  pull_request:
    paths:
      - "governance/m1-2-fm00-baseline/**"
      - "research/fm00/**"
      - ".github/workflows/iios_m12_fm00_git_baseline.yml"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fm00-git-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FM00 validation dependency
        run: python -m pip install --disable-pip-version-check "jsonschema==4.26.0"

      - name: Verify FM00 baseline ancestry
        run: |
          test "$(git rev-parse HEAD)" != ""
          git merge-base --is-ancestor 536e883bc873dbe7dd7383690a7a95a0f65591a7 HEAD

      - name: Verify immutable FM00 source tag
        run: |
          test "$(git rev-list -n 1 m1.2-fm00-v0.1.0)" = "536e883bc873dbe7dd7383690a7a95a0f65591a7"
          test "$(git rev-parse refs/tags/m1.2-fm00-v0.1.0)" = "aac0cccf596ee2703caedffc08f434be9e2dffed"

      - name: Verify FM00 scope has not drifted in Git lineage
        run: |
          git diff --quiet 536e883bc873dbe7dd7383690a7a95a0f65591a7 HEAD -- research/fm00/

      - name: Verify governance manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("governance/m1-2-fm00-baseline/M1_2_FM00_BASELINE_MANIFEST_v0.2.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "CANDIDATE"
          assert d["fm00_exact_anchor"]["commit"] == "536e883bc873dbe7dd7383690a7a95a0f65591a7"
          assert d["fm00_exact_anchor"]["tag_object_sha"] == "aac0cccf596ee2703caedffc08f434be9e2dffed"
          assert d["g2_reference"]["historical_frozen_carrier_sha256"] == "899f0b1b9f3619458e17be76ac43dd6e00b5397d0c12adb7b68e2479c7f51524"
          assert d["current_successor_evidence"]["carrier_sha256"] == "bd5cbaf23c9029b46fafd19992029932431059de7424a08de48624aca5d431c8"
          assert d["current_successor_evidence"]["historical_identity_rewritten"] is False
          assert d["current_successor_evidence"]["frozen_normative_bytes_modified"] is False
          assert d["fm01_boundary"]["exact_m11_source_snapshot_present"] is False
          print("FM00 Git Baseline manifest: PASS")
          PY

      - name: Run FM00 deterministic CI
        run: |
          python -m compileall -q research/fm00
          python -m unittest discover -s research/fm00/tests -p 'test_*.py' -v
          python research/fm00/fm00_validator.py

      - name: Verify no tracked generated debris
        run: |
          ! git ls-files | grep -E '(__pycache__/|\.pyc$|\.pytest_cache/|\.log$|\.tmp$)' || (echo "tracked generated debris found" && exit 1)

      - name: Verify diff whitespace
        run: git diff --check
