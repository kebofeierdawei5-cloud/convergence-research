name: IIOS Investment Core CI

on:
  pull_request:
    paths:
      - "iios_mvp/**"
      - "tests/test_mvp.py"
      - "tests/test_value_core.py"
      - "tests/test_investment_core_contract.py"
      - "tests/test_investment_core_v03.py"
      - "tests/test_market_model_domain.py"
      - "tests/test_market_model_identification.py"
      - "tests/test_market_implied_expectation.py"
      - "tests/test_ratio_market_implied_expectation.py"
      - "tests/test_dcf_ddm_conditional_market_implied_expectation.py"
      - "tests/test_sotp_rnpv_market_implied_expectation.py"
      - "tests/test_multi_model_market_implied_expectation_set.py"
      - "tests/test_p4f_mie_snapshot.py"
      - "tests/test_semantic_expectation_gap.py"
      - "tests/test_core00_scope.py"
      - "tests/test_research_intake.py"
      - "tests/test_company_economic_core.py"
      - "tests/test_p1_1_evidence_root_admission.py"
      - "examples/**"
      - "schemas/**"
      - ".github/workflows/iios_mvp.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/**"
      - "tests/test_mvp.py"
      - "tests/test_value_core.py"
      - "tests/test_investment_core_contract.py"
      - "tests/test_market_model_domain.py"
      - "tests/test_market_model_identification.py"
      - "tests/test_market_implied_expectation.py"
      - "tests/test_ratio_market_implied_expectation.py"
      - "tests/test_dcf_ddm_conditional_market_implied_expectation.py"
      - "tests/test_sotp_rnpv_market_implied_expectation.py"
      - "tests/test_multi_model_market_implied_expectation_set.py"
      - "tests/test_p4f_mie_snapshot.py"
      - "examples/**"
      - "schemas/**"
      - ".github/workflows/iios_mvp.yml"

jobs:
  test-mvp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q iios_mvp tests/test_mvp.py tests/test_investment_core_contract.py tests/test_investment_core_v03.py tests/test_market_model_domain.py tests/test_market_model_identification.py tests/test_market_implied_expectation.py tests/test_ratio_market_implied_expectation.py tests/test_dcf_ddm_conditional_market_implied_expectation.py tests/test_sotp_rnpv_market_implied_expectation.py tests/test_multi_model_market_implied_expectation_set.py tests/test_p4f_mie_snapshot.py tests/test_semantic_expectation_gap.py tests/test_core00_scope.py tests/test_research_intake.py tests/test_company_economic_core.py tests/test_p1_1_evidence_root_admission.py
      - run: python -m pip install --disable-pip-version-check pytest jsonschema
      - run: python -m pytest -q tests/test_mvp.py tests/test_value_core.py tests/test_investment_core_contract.py tests/test_investment_core_v03.py tests/test_market_model_domain.py tests/test_market_model_identification.py tests/test_market_implied_expectation.py tests/test_ratio_market_implied_expectation.py tests/test_dcf_ddm_conditional_market_implied_expectation.py tests/test_sotp_rnpv_market_implied_expectation.py tests/test_multi_model_market_implied_expectation_set.py tests/test_p4f_mie_snapshot.py tests/test_semantic_expectation_gap.py tests/test_core00_scope.py tests/test_research_intake.py tests/test_company_economic_core.py tests/test_p1_1_evidence_root_admission.py
      - run: |
          python -m json.tool schemas/investment_core_case_v0.2.schema.json >/dev/null
          python -m json.tool schemas/investment_core_case_v0.3.schema.json >/dev/null
          python -m json.tool schemas/market_model_domain_v0.2.schema.json >/dev/null
          python -m json.tool schemas/market_model_identification_v0.2.schema.json >/dev/null
          python -m json.tool schemas/market_implied_expectation_v0.2.schema.json >/dev/null
          python -m json.tool schemas/market_implied_expectation_set_v0.2.schema.json >/dev/null
          python -m json.tool schemas/p4f_mie_snapshot_v0.2.schema.json >/dev/null
      - run: PYTHONPATH=. python -m iios_mvp.cli run examples/iios_mvp_demo.json --out /tmp/iios-mvp
      - run: |
          snapshot=$(find /tmp/iios-mvp -maxdepth 1 -name '*.json' ! -name '*.series.json' ! -name '*.index.json' ! -name '*.decision.json' | head -n 1)
          test -n "$snapshot"
          PYTHONPATH=. python -m iios_mvp.cli replay "$snapshot"

# P2-A integration audit CI trigger
