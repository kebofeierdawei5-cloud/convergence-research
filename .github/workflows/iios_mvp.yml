name: IIOS MVP v0.1.1

on:
  pull_request:
    paths:
      - "iios_mvp/**"
      - "tests/test_mvp.py"
      - "tests/test_value_core.py"
      - "examples/**"
      - ".github/workflows/iios_mvp.yml"
  push:
    branches: [main]
    paths:
      - "iios_mvp/**"
      - "tests/test_mvp.py"
      - "examples/**"
      - ".github/workflows/iios_mvp.yml"

jobs:
  test-mvp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q iios_mvp tests/test_mvp.py
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_mvp.py tests/test_value_core.py
      - run: PYTHONPATH=. python -m iios_mvp.cli run examples/iios_mvp_demo.json --out /tmp/iios-mvp
      - run: |
          snapshot=$(find /tmp/iios-mvp -maxdepth 1 -name '*.json' ! -name '*.series.json' ! -name '*.index.json' ! -name '*.decision.json' | head -n 1)
          test -n "$snapshot"
          PYTHONPATH=. python -m iios_mvp.cli replay "$snapshot"
