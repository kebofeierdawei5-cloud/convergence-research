name: IIOS B1 Canonical Research Orchestrator

on:
  pull_request:
    paths:
      - "iios_mvp/canonical_research_orchestrator.py"
      - "schemas/iios_run_receipt_v0.1.schema.json"
      - "schemas/llm_semantic_artifact_v0.1.schema.json"
      - "tests/test_canonical_research_orchestrator.py"
      - "tests/test_b1_schemas.py"
      - "docs/iios/B1_LLM_CANONICAL_RESEARCH_ORCHESTRATOR_DESIGN_v0.1.md"
      - "docs/iios/B1_LLM_SEMANTIC_CONTRACT_DESIGN_v0.1.md"
      - "docs/iios/B1_LLM_ACCEPTANCE_20261007.md"
      - "docs/PROJECT_STATE_INDEX.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Run B1 tests
        run: python -m pytest -q tests/test_canonical_research_orchestrator.py tests/test_b1_schemas.py
      - name: Compile
        run: python -m compileall -q iios_mvp/canonical_research_orchestrator.py
      - name: Validate JSON schemas
        run: |
          python -m json.tool schemas/iios_run_receipt_v0.1.schema.json >/dev/null
          python -m json.tool schemas/llm_semantic_artifact_v0.1.schema.json >/dev/null
      - name: Diff check
        run: git diff --check
