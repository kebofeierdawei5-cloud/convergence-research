name: IIOS M1.2 FM04 Third Independent Red-team

on:
  pull_request:
    paths:
      - "research/fm00/**"
      - "research/fm01/**"
      - "research/fm02/**"
      - "research/fm03/**"
      - "research/fm04/**"
      - ".github/workflows/iios_m12_fm04_third_redteam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  third-redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Verify canonical post-FM04-R baseline
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "7f08d55356dda8fbcbc448446b11925da6c42195"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git show -s --format='%H %s' origin/main
      - name: Build exact FM02 snapshot
        run: |
          python research/fm02/fm02_feature_builder.py --output /tmp/FM02_FEATURE_SNAPSHOT.ndjson --receipt /tmp/FM02_FEATURE_BUILD_RECEIPT.json
      - name: Build exact FM03 snapshot
        run: |
          python research/fm03/fm03_state_engine.py --feature-snapshot /tmp/FM02_FEATURE_SNAPSHOT.ndjson --output /tmp/FM03_STATE_SNAPSHOT.ndjson --receipt /tmp/FM03_STATE_BUILD_RECEIPT.json
      - name: Verify pinned FM03 snapshot
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/FM03_STATE_SNAPSHOT.ndjson').read_text().splitlines() if x.strip()]
          sha=hashlib.sha256(json.dumps(rows,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert len(rows)==22
          assert sha=='7e020df6eeb5b6aa4cf47e625d902c3c5ca7645457427c8af085a55d25811fd4'
          print('FM03 snapshot PASS',sha)
          PY
      - name: Rebuild exact FM04 result
        env:
          FM03_STATE_SNAPSHOT: /tmp/FM03_STATE_SNAPSHOT.ndjson
        run: |
          python research/fm04/fm04_conditional_backtest.py --state-snapshot /tmp/FM03_STATE_SNAPSHOT.ndjson --driver-history research/fm01/CATL_DRIVER_HISTORY.ndjson --output /tmp/FM04_BACKTEST_RESULT.json
      - name: Third independent full-result replay and mutation audit
        env:
          FM03_STATE_SNAPSHOT: /tmp/FM03_STATE_SNAPSHOT.ndjson
        run: python research/fm04/fm04_third_independent_redteam.py
      - name: Compile third red-team harness
        run: python -m compileall -q research/fm04/fm04_third_independent_redteam.py
      - name: Diff check
        run: git diff --check
