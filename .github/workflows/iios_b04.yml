name: IIOS B04 Forecast-Valuation-Return Lineage

on:
  pull_request:
    paths:
      - "iios_mvp/forecast_valuation_return_lineage_v01.py"
      - "iios_mvp/investment_core_contract_v03.py"
      - "schemas/investment_core_case_v0.3.schema.json"
      - "tests/test_b04_*.py"
      - ".github/workflows/iios_b04.yml"
  workflow_dispatch:

jobs:
  b04-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest jsonschema
      - name: Compile B04 implementation
        run: python -m compileall -q iios_mvp tests/test_b04_forecast_valuation_return_lineage.py tests/test_b04_core_integration.py
      - name: Validate B04 schema definition
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open("schemas/investment_core_case_v0.3.schema.json", encoding="utf-8") as f:
              schema = json.load(f)
          Draft202012Validator.check_schema(schema)
          print("B04 schema check: PASS")
          PY
      - name: Run B04 lineage tests
        run: python -m pytest -q tests/test_b04_forecast_valuation_return_lineage.py tests/test_b04_core_integration.py
