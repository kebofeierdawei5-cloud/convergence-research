name: IIOS B2 Data Evidence PIT

on:
  pull_request:
    paths:
      - "research/b2/**"
      - "schemas/evidence_record_v0.1.schema.json"
      - "schemas/source_registry_v0.1.schema.json"
      - "schemas/pit_temporal_semantics_v0.1.schema.json"
      - "configs/source_registry_v0.1.json"
      - "docs/iios/B2_*.md"
      - ".github/workflows/iios_b2.yml"
  push:
    branches: [main]
    paths:
      - "research/b2/**"
      - "schemas/evidence_record_v0.1.schema.json"
      - "schemas/source_registry_v0.1.schema.json"
      - "schemas/pit_temporal_semantics_v0.1.schema.json"
      - "configs/source_registry_v0.1.json"
      - "docs/iios/B2_*.md"
      - ".github/workflows/iios_b2.yml"

permissions:
  contents: read

jobs:
  b2:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile B2
        run: python -m compileall -q research/b2
      - name: Run B2 tests
        run: python -m pytest -q research/b2/tests
      - name: Validate B2 JSON schemas and registry
        run: |
          python -m json.tool schemas/evidence_record_v0.1.schema.json >/dev/null
          python -m json.tool schemas/source_registry_v0.1.schema.json >/dev/null
          python -m json.tool schemas/pit_temporal_semantics_v0.1.schema.json >/dev/null
          python -m jsonschema -i configs/source_registry_v0.1.json schemas/source_registry_v0.1.schema.json
      - name: Prove A02 fails closed when exact bytes are absent
        run: |
          mkdir -p /tmp/b2-empty /tmp/b2-result
          python -m research.b2.a02_exact_admission --input-dir /tmp/b2-empty --out /tmp/b2-result
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/b2-result/A02_EXACT_ADMISSION_RESULT.json').read_text())
          assert result['status'] == 'BLOCKED'
          assert result['selection_permission'] is False
          assert result['object_A_terminal_000906']['exact_bytes'] is False
          PY
      - name: Verify working tree
        run: git diff --check
