name: IIOS — One-click case readiness (read-only)

on:
  pull_request:
    paths:
      - "tools/iios_one_click_readiness_v01.py"
      - "tools/iios_one_click_readiness_ui_v01.py"
      - "tests/test_iios_one_click_readiness_v01.py"
      - "tests/test_iios_one_click_readiness_ui_v01.py"
      - "docs/iios/IIOS_ONE_CLICK_READINESS_20261010.md"
      - ".github/workflows/iios_one_click_case_readiness.yml"
  workflow_dispatch:
    inputs:
      authorize_read_only_preflight:
        description: "I approve a read-only check of canonical main only. No local files, data writes, ChatGPT call, investment decision, or order execution."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract-tests:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile diagnostics
        run: python -m py_compile tools/iios_one_click_readiness_v01.py tools/iios_one_click_readiness_ui_v01.py
      - name: Run fail-closed contract tests
        run: python -m pytest -q tests/test_iios_one_click_readiness_v01.py tests/test_iios_one_click_readiness_ui_v01.py
      - name: Check patch formatting
        run: git diff --check

  readiness:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_read_only_preflight }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Chinese readiness report
        run: |
          set -euo pipefail
          python tools/iios_one_click_readiness_ui_v01.py --repo-root . --report-dir artifacts/operator-readiness
          {
            echo "## IIOS 一键预检"
            echo
            echo "本任务没有执行 canonical-run。Actions 显示成功仅代表诊断报告生成成功；请阅读以下预检结论。"
            echo
            cat artifacts/operator-readiness/RC-CN-A-605016-20261009-readiness.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload human and machine reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iios-readiness-${{ github.run_id }}
          path: artifacts/operator-readiness/
          if-no-files-found: error
          retention-days: 14
